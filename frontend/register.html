<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — A+ Freshman Tutorial</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="loading" hidden>Waking up the server, this can take up to a minute on the first visit.</div>
  <div id="navbar"></div>

  <div class="container">
    <div class="form-card">
      <h2>Create your account</h2>
      <div id="alertBox"></div>
      <form id="registerForm" novalidate>
        <div class="form-group">
          <label for="fullName">Full name</label>
          <input type="text" id="fullName" name="fullName" autocomplete="name" required placeholder="Your full name">
        </div>
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" autocomplete="email" required placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label for="password">Password <span class="text-muted">(min 8 characters)</span></label>
          <input type="password" id="password" name="password" autocomplete="new-password" required placeholder="Choose a password" minlength="8">
        </div>
        <div class="form-group">
          <label for="stream">Your stream</label>
          <select id="stream" name="stream">
            <option value="">— Select your stream —</option>
            <option value="natural">Natural Science</option>
            <option value="social">Social Science</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%" id="submitBtn">Create account</button>
        <p id="wakeMsg" style="display:none;font-size:.85rem;color:#92400e;background:#fef3c7;border-radius:.4rem;padding:.6rem .9rem;margin-top:.75rem;text-align:center">
          ⏳ Waking up the server — this can take up to 60 seconds on the first visit. Please wait…
        </p>
      </form>
      <p class="text-muted mt-1 text-center">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    renderNavbar("register");
    if (isLoggedIn()) redirectAfterAuth(getUser());

    // Pre-fill stream from query string or localStorage
    const params = new URLSearchParams(location.search);
    const preStream = params.get("stream") || localStorage.getItem("stream") || "";
    if (preStream) document.getElementById("stream").value = preStream;

    const form     = document.getElementById("registerForm");
    const alertBox = document.getElementById("alertBox");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async e => {
      e.preventDefault();
      alertBox.textContent = "";
      const fullName = document.getElementById("fullName").value.trim();
      const email    = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const stream   = document.getElementById("stream").value || null;

      if (!fullName || !email || !password) {
        alertBox.innerHTML = `<div class="alert alert-error">Please fill in all required fields.</div>`;
        return;
      }
      if (password.length < 8) {
        alertBox.innerHTML = `<div class="alert alert-error">Password must be at least 8 characters.</div>`;
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Creating account…";
      const wakeMsg = document.getElementById("wakeMsg");

      // Show wake-up message after 4 seconds (Render cold start)
      const wakeTimer = setTimeout(() => { wakeMsg.style.display = "block"; }, 4000);

      let res;
      try {
        res = await register(fullName, email, password, stream);
      } catch (err) {
        clearTimeout(wakeTimer);
        wakeMsg.style.display = "none";
        alertBox.innerHTML = `<div class="alert alert-error">Could not reach the server. Please try again in a moment.</div>`;
        submitBtn.disabled = false;
        submitBtn.textContent = "Create account";
        return;
      }

      clearTimeout(wakeTimer);
      wakeMsg.style.display = "none";

      if (!res.success) {
        alertBox.innerHTML = `<div class="alert alert-error">${res.message || "Registration failed."}</div>`;
        submitBtn.disabled = false;
        submitBtn.textContent = "Create account";
      }
    });
  </script>
</body>
</html>
