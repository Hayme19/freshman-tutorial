<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discussion Forum — A+ Freshman Tutorial</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="loading" hidden>Waking up the server, this can take up to a minute on the first visit.</div>
  <div id="navbar"></div>

  <div class="container" style="padding-top:2rem;padding-bottom:3rem;max-width:800px">
    <h1 class="section-title">Discussion Forum</h1>

    <!-- New post -->
    <div class="card mb-2" id="newPostSection">
      <h2 style="font-size:1rem;margin-bottom:1rem">Ask a Question</h2>
      <div id="postAlertBox"></div>
      <div class="form-group">
        <label for="postCourseId">Course</label>
        <select id="postCourseId"></select>
      </div>
      <div class="form-group">
        <label for="postTitle">Title</label>
        <input type="text" id="postTitle" placeholder="Brief summary of your question">
      </div>
      <div class="form-group">
        <label for="postBody">Question</label>
        <textarea id="postBody" placeholder="Describe your question in detail…"></textarea>
      </div>
      <button class="btn btn-primary" id="submitPost">Post Question</button>
    </div>

    <!-- Filter by course -->
    <div class="flex gap-1 mb-1 items-center flex-wrap">
      <label for="filterCourse" style="margin:0">Filter by course:</label>
      <select id="filterCourse" style="width:auto"></select>
      <button class="btn btn-outline btn-sm" id="loadPostsBtn">Load</button>
    </div>

    <div id="forumPosts"></div>
  </div>

  <footer class="site-footer">
    <p class="footer-copy">&copy; 2026 <strong>Haymanot Andarg Wubale</strong>. All rights reserved.</p>
    <p class="footer-tagline">Built with <span class="heart">&#10084;</span> in Bahir Dar, Ethiopia</p>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/forum.js"></script>
</body>
</html>
