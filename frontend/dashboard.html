<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — A+ Freshman Tutorial</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <div id="loading" hidden>Waking up the server, this can take up to a minute on the first visit.</div>
  <div id="navbar"></div>

  <div class="container" style="padding-top:2rem;padding-bottom:3rem">
    <h1 class="section-title">My Progress</h1>

    <!-- Summary stats -->
    <div class="stat-grid mb-2" id="statGrid">
      <div class="stat-box">
        <div class="stat-value" id="statEnrolled">–</div>
        <div class="stat-label">Enrolled Courses</div>
      </div>
      <div class="stat-box">
        <div class="stat-value" id="statCompleted">–</div>
        <div class="stat-label">Completed</div>
      </div>
      <div class="stat-box">
        <div class="stat-value" id="statAvgProgress">–</div>
        <div class="stat-label">Avg Progress</div>
      </div>
    </div>

    <!-- Progress chart -->
    <div class="chart-card mb-2">
      <h2 style="font-size:1.1rem;margin-bottom:1rem">Course Progress</h2>
      <canvas id="progressChart" aria-label="Progress chart per course" role="img"></canvas>
    </div>

    <!-- Enrollment list -->
    <h2 style="font-size:1.1rem;margin-bottom:1rem">Enrolled Courses</h2>
    <div id="enrollmentList"></div>
  </div>

  <footer class="site-footer">
    <p class="footer-copy">&copy; 2026 <strong>Haymanot Andarg Wubale</strong>. All rights reserved.</p>
    <p class="footer-tagline">Built with <span class="heart">&#10084;</span> in Bahir Dar, Ethiopia</p>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
